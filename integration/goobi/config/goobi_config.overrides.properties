# Keys this institution sets in /opt/digiverso/goobi/config/goobi_config.properties.
#
# NOT a copy of that file. Goobi ships it, and a stock copy pinned here would
# go stale on the next Goobi upgrade. Only the lines we change live here:
# install.sh --config sets each key (replacing every existing line for it,
# which also clears the duplicated-lines problem in PROVISIONING.md section 2)
# and drift_check.sh reports any key whose live value differs.
#
# Format: key=value, one per line. Blank lines and # comments are ignored.
# Values are taken literally -- no quoting, no variable expansion.
#
# Add a key here BEFORE changing it on a server; a key changed only on the
# server is drift, and the next fresh install silently loses it.

# Runs the delay plugin's daily sweep, which closes steps whose delay has
# expired (stage 9, Review to Remove). Goobi schedules every job whose
# getJobName() has a Quartz cron here (JobManager.initializeJob reads
# ConfigurationHelper.getJobStartTime(<job name>)); DelayJob's name is
# "dailyDelayJob". With the key absent the job never runs and delayed steps
# never close. Quartz cron: sec min hour day-of-month month day-of-week.
# 02:00 daily, as harvested from the old WSL host on 2026-10-15; any daily
# time works.
dailyDelayJob=0 0 2 * * ?
