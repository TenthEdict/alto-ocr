# Reverse proxy for the browser transcript-review server, so it is reached
# through the same Apache -- and the same access control -- as Goobi.
#
#   sudo install -m 644 apache-ocr-review.conf /etc/apache2/conf-available/
#   sudo a2enmod proxy proxy_http headers
#   sudo a2enconf apache-ocr-review
#   sudo systemctl reload apache2
#
# Then the review UI is at   https://<goobi-host>/ocr-review/
# and the Goobi task link points at exactly that URL.
#
# WHY THIS FILE MATTERS: the review server writes to the archive's ALTO and
# authenticates nobody. It binds to 127.0.0.1 so that this proxy is the only
# way in. Whatever protects /goobi must protect /ocr-review too -- otherwise
# anyone who can reach the host can rewrite any transcript.

<Location /ocr-review/>
    ProxyPass        http://127.0.0.1:8081/
    ProxyPassReverse http://127.0.0.1:8081/

    # Same auth as Goobi. Uncomment and match your Goobi <Location> block --
    # LDAP here, since that is what this install uses for Goobi logins.
    #
    # AuthType Basic
    # AuthName "Purdue Libraries — OCR transcript review"
    # AuthBasicProvider ldap
    # AuthLDAPURL "ldap://<ldap-host>/ou=people,dc=example,dc=edu?uid?sub?(objectClass=*)"
    # Require valid-user

    # Page scans are large. Goobi's own vhost already raises Timeout to 300;
    # a first-touch render of a 177 MB oversize TIF takes seconds, and the
    # cached render after it is a file read.
    ProxyTimeout 300
</Location>

# No Cache-Control rules here on purpose. The app sets them per response and
# knows which is which: page renders are immutable for the life of their
# cache key (the scan's mtime is in it) and are marked cacheable, while JSON
# is marked no-store because a cached page payload would hand a corrector a
# token for a version of the ALTO that is gone. A blanket rule over
# /ocr-review/api/ would clobber the image headers -- the scans are the only
# large thing this UI moves, and they must stay cacheable.
