name: CI

# Test CI for github.itap.purdue.edu (Purdue's GitHub Enterprise Server).
#
# An Enterprise Server has NO GitHub-hosted runners (there is no ubuntu-latest /
# windows-latest to borrow), so this job targets a SELF-HOSTED runner you
# register under: repo -> Settings -> Actions -> Runners -> "New self-hosted
# runner". Until a runner is online, runs sit in "Queued" — that is expected,
# not an error. The runner just needs Python 3.12 + pip on PATH; the suite is
# pure logic (no Tesseract, no Ollama), so it stays fast.
#
# Cross-platform (Windows + Linux) is load-bearing for this tool (see
# CLAUDE.md). A single runner only covers its own OS; the pre-push hook
# (scripts/hooks/pre-push) covers whichever OS you push from. To get both in CI,
# register a second runner on the other OS and turn `runs-on` into a matrix of
# their labels.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so a rapid series of pushes doesn't
# queue redundant jobs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (self-hosted)
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4

      - name: Show Python version
        run: python --version

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: python -m unittest discover -s tests -v
